<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Blocking, runs before first paint: applies the last theme this
			// browser saw so returning visitors don't flash BM-then-their-theme
			// on every load. The authoritative per-user value from the server
			// still reconciles this in +layout.svelte once /api/auth/me
			// resolves (e.g. first login on a new device, or a theme changed
			// on another device) — this is just the fast local cache.
			(function () {
				try {
					var theme = localStorage.getItem('mf:theme');
					if (theme) document.documentElement.dataset.theme = theme;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
