[project]
name = "metaforge-api"
version = "0.1.0"
description = "MetaForge backend: metadata-driven ERP engine (domain/infrastructure/api layers)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "passlib[argon2]>=1.7.4",
  "pyjwt>=2.9",
  "arq>=0.26",
  "redis>=5.2",
  "boto3>=1.35",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/metaforge_api"]
